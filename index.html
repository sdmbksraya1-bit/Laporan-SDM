<style>
:root{--bar:#ffffff;--ink:#1f2a44;--mute:#6b7a99;--line:#e1e6f0;--on:#4f63e6;color-scheme:light dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bar);color:var(--ink);font:600 15px/1.2 system-ui,-apple-system,'Segoe UI',sans-serif}
nav{flex:none;display:flex;gap:6px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px));background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:none;font:inherit;color:var(--mute);background:none;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--on);background:color-mix(in srgb,var(--on) 12%,transparent);border-bottom-color:var(--on)}
nav button:focus-visible{outline:3px solid var(--on);outline-offset:1px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
iframe[hidden]{display:none}
</style>

bs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js\"><\/script>\n<script>\nconst KIND={tk:'Data TK',ful:'Fulfillment',abs:'Absensi bulan ini',lbr:'Rekap lembur',dplk:'Portofolio DPLK',pes:'Rekap pesangon',rkap:'RKAP lembur 2026',jab:'Rekap absensi Jan–Agt',eval:'Evaluasi lembur (reimburse)'};\nconst PETA={\"JASA O&M PACKER BIRINGKASSI\":0,\"JASA O&M PP MAKASSAR\":0,\"JASA O&M SILO PANTAI BIRINGKASSI\":0,\"JASA POS LAYANAN KENDARAAN\":0,\"PEMUATAN SEMEN CURAH TONASA 2/3/4/5\":0,\"PENGANTONGAN PABRIK 2/3\":0,\"PENJUMBOAN SEMEN CURAH PABRIK\":0,\"PP AMBON\":0,\"PP BALIKPAPAN\":0,\"PP BANJARMASIN\":0,\"PP BITUNG\":0,\"PP CELUKAN BAWANG\":0,\"PP KENDARI\":0,\"PP MALUKU UTARA\":0,\"PP MAMUJU\":0,\"PP PALU\":0,\"PP PONTIANAK\":0,\"PP SAMARINDA\":0,\"PP SORONG\":0,\"BM KLINKER\":1,\"BM SEMEN BAG LASAHAN VESSEL\":1,\"BM SEMEN CURAH\":1,\"BM SEMEN JUMBO VIA FASILITAS PENJUMBOAN\":1,\"BM SEMEN JUMBO VIA TRUCK\":1,\"BONGKAR MATERIAL\":1,\"CRANE DARAT BKS\":1,\"CRANE DARAT PABRIK\":1,\"FORKLIFT PABRIK\":1,\"INDUSTRIAL CLEANING BKS\":2,\"AKUNTANSI\":3,\"ASET & PERSEDIAAN\":3,\"HUKUM, KEPATUHAN & MANAJEMEN RESIKO\":3,\"INTERNAL AUDIT\":3,\"JASA LAYANAN PRODUKSI TERAK\":3,\"K3\":3,\"KESEKTARIATAN & SISTEM MANAJEMEN\":3,\"KEUANGAN & PAJAK\":3,\"PEMELIHARAAN DUST COLLECTOR\":3,\"PENGADAAN\":3,\"PENGANTONGAN PABRIK 5\":3,\"PIUTANG\":3,\"PUP & REBRICKING\":3,\"SDM\":3,\"SUPPORTING PABRIK\":3,\"WORKSHOP & PENUNJANG\":3};\nconst REIMB=new Set([\"JASA O&M PACKER BIRINGKASSI\", \"JASA O&M PP MAKASSAR\", \"JASA O&M SILO PANTAI BIRINGKASSI\", \"JASA POS LAYANAN KENDARAAN\", \"PP AMBON\", \"PP BALIKPAPAN\", \"PP BANJARMASIN\", \"PP BITUNG\", \"PP CELUKAN BAWANG\", \"PP KENDARI\", \"PP MALUKU UTARA\", \"PP MAMUJU\", \"PP PONTIANAK\", \"PP SAMARINDA\", \"PP SORONG\"]);\nconst nr=r=>!REIMB.has(String(r.AREA_NAME||'').trim().toUpperCase());\nconst KEL=['Pemuatan Semen','Bongkar Muat & Sewa Alat','Pembersihan','Pemeliharaan Pabrik & Penunjang'];\nconst BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];\nconst NM=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];\nconst MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,ags:8,agu:8,agt:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};\nconst monOf=v=>MON[String(v||'').trim().slice(0,3).toLowerCase()]||0;\nconst dm=d=>{const x=new Date(d.getTime()+43200000);return[x.getFullYear(),x.getMonth()+1]};\nconst S={};let charts={},curPer=9,sfMon=0;\nlet SKM={};try{SKM=JSON.parse(localStorage.getItem('sdm_sanksi')||'{}')}catch(e){}\nconst saveSk=()=>{try{localStorage.setItem('sdm_sanksi',JSON.stringify(SKM))}catch(e){}};\nfunction renderSf(per){const f=['Teguran','SP1','SP2','SP3','PHK'];\n  $('sf').innerHTML=`<div class=\"sfr\"><label>Bulan<select id=\"sfm\">${NM.map((n,i)=>`<option value=\"${i+1}\" ${i+1===(sfMon||per)?'selected':''}>${n}<\/option>`).join('')}<\/select><\/label>${f.map((n,i)=>`<label>${n}<input type=\"number\" min=\"0\" id=\"sf${i}\" placeholder=\"0\"><\/label>`).join('')}<button class=\"btn\" id=\"sfs\" type=\"button\">Simpan<\/button><\/div>`+(Object.keys(SKM).length?`<div class=\"chips\">${Object.keys(SKM).map(Number).sort((a,b)=>a-b).map(m=>`<span class=\"chip ok\">${BLN[m-1]} <a href=\"#\" data-m=\"${m}\" style=\"color:inherit\" aria-label=\"Hapus ${NM[m-1]}\">✕<\/a><\/span>`).join('')}<\/div>`:'');\n  const fill=()=>{sfMon=+$('sfm').value;const v=SKM[sfMon]||[];f.forEach((_,i)=>$('sf'+i).value=v[i]??'')};$('sfm').onchange=fill;fill();\n  $('sfs').onclick=()=>{sfMon=+$('sfm').value;SKM[sfMon]=f.map((_,i)=>+$('sf'+i).value||0);saveSk();render()};\n  $('sf').querySelectorAll('a[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();delete SKM[a.dataset.m];saveSk();render()})}\nconst $=id=>document.getElementById(id);\nconst num=v=>typeof v==='number'?v:(parseFloat(v)||0);\nconst fmt=n=>Math.round(n).toLocaleString('id-ID');\nconst rp=n=>{const a=Math.abs(n),s=n<0?'-':'';return a>=1e9?s+'Rp'+(a/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M':a>=1e6?s+'Rp'+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':s+'Rp'+fmt(a)};\nconst pct=n=>(n*100).toLocaleString('id-ID',{maximumFractionDigits:1})+'%';\nconst esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst rr=ws=>ws&&ws['!ref']?XLSX.utils.sheet_to_json(ws,{header:1,defval:null,range:{s:{r:0,c:0},e:XLSX.utils.decode_range(ws['!ref']).e}}):[];\nconst rows=(k,sh)=>{const w=S[k];return w&&w.Sheets[sh]?rr(w.Sheets[sh]):[]};\nconst objs=(k,sh)=>{const w=S[k];return w&&w.Sheets[sh]?XLSX.utils.sheet_to_json(w.Sheets[sh],{defval:null}):[]};\n\nfunction detectWb(wb){const n=wb.SheetNames,has=x=>n.includes(x);\n  if(has('Kehadiran 2026'))return'jab';if(has('RKAP Lbr'))return'eval';if(has('Pesangon'))return'pes';\n  if(has('PKWTT')&&has('PKWT'))return'dplk';if(has('Rekap')&&has('1'))return'lbr';\n  if(has('Jun')&&has('Okt')&&has('Sep'))return'tlbr';\n  const flat=rr(wb.Sheets[n[0]]).slice(0,6).flat().map(x=>String(x||'').toUpperCase()).join('|');\n  if(flat.includes('URAIAN')&&flat.includes('JANUARI'))return'rkap';\n  if(flat.includes('TEGURAN')&&flat.includes('SP1'))return'sanksi';\n  if(flat.includes('BULAN')&&flat.includes('ALPA')&&flat.includes('SAKIT'))return'hadir';\n  if(flat.includes('EMP_ID')&&flat.includes('EMP_STATUS'))return'tk';\n  if(flat.includes('KEBUTUHAN'))return'ful';\n  const s2=wb.Sheets['Sheet2'];if(s2){const a=rr(s2)[0];if(a&&String(a[0]||'').toUpperCase().includes('ABSENSI'))return'abs'}\n  return null}\nasync function load(files){const bad=[];\n  for(const f of files){let wb;try{wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true})}catch(e){bad.push(f.name+' (gagal dibaca)');continue}\n    const k=detectWb(wb);if(!k){bad.push(f.name+' (tidak dipakai)');continue}S[k]=wb;S[k+'_n']=f.name}\n  chips(bad);render()}\nfunction chips(bad=[]){$('chips').innerHTML=Object.keys(KIND).map(k=>`<span class=\"chip ${S[k]?'ok':''}\">${S[k]?'✓ ':''}${KIND[k]}<\/span>`).join('')+bad.map(n=>`<span class=\"chip no\">${esc(n)}<\/span>`).join('')}\n\nfunction trend(k,cols){const o={};if(!S[k])return o;rows(k,S[k].SheetNames[0]).forEach(r=>{const m=monOf(r[2]);if(m&&cols.some(c=>typeof r[c]==='number'))o[m]=cols.map(c=>num(r[c]))});return o}\nfunction jabGrup(j){j=String(j||'').toUpperCase();return j.includes('DIVISI')?'Kepala Divisi':j.includes('KEPALA UNIT')?'Kepala Unit':j.includes('SUPERVISOR')?'Supervisor':j?'Pelaksana':'Tidak diketahui'}\n\nfunction render(){\n  if(!Object.keys(KIND).some(k=>S[k]))return;$('out').hidden=false;\n  const tk=S.tk?objs('tk',S.tk.SheetNames[0]).filter(r=>r.EMP_ID):[];\n  let per=0,thn=2026;\n  if(tk[0]&&tk[0].PP_CODE){const p=String(tk[0].PP_CODE).split('-');thn=+p[0];per=+p[1]}\n  if(!per&&S.lbr)per=Math.max(...S.lbr.SheetNames.filter(n=>/^\\d+$/.test(n)).map(Number));\n  if(!per)per=9;curPer=per;\n  $('sub').textContent='PT Biringkassi Raya · Per '+NM[per-1]+' '+thn;\n  const bln=NM[per-1],has=tk.length>0,total=tk.length;\n  const pkwtt=tk.filter(r=>r.EMP_STATUS==='PKWTT').length,pkwt=tk.filter(r=>r.EMP_STATUS==='PKWT').length;\n  const lk=tk.filter(r=>String(r.GENDER).toUpperCase()==='PRIA').length;\n  const masuk=tk.filter(r=>r.START_DATE instanceof Date&&dm(r.START_DATE)[0]===thn&&dm(r.START_DATE)[1]===per).length;\n  const pes=S.pes?objs('pes','Pesangon').filter(r=>r['TGL KELUAR'] instanceof Date&&dm(r['TGL KELUAR'])[0]===thn):[];\n  const keluar=S.pes?pes.filter(r=>dm(r['TGL KELUAR'])[1]===per).length:null;\n  let F=null;if(S.ful){const r=rows('ful',S.ful.SheetNames[0]).find(x=>x[2]==='TOTAL');if(r)F={keb:num(r[4]),pkwt:num(r[5]),pkwtt:num(r[6]),os:num(r[7]),tf:num(r[8]),tot:num(r[10]),dev:num(r[11])}}\n\n  // lembur\n  const L=[],top={k:[],u:[]};\n  if(S.lbr){let cur=[];S.lbr.SheetNames.filter(n=>/^\\d+$/.test(n)).forEach(n=>{const d=objs('lbr',n).filter(r=>r.EMP_ID);L[+n]=d.reduce((s,r)=>s+num(r.OT),0);if(+n===per)cur=d});\n    top.k=[...cur].filter(nr).sort((a,b)=>num(b.OT)-num(a.OT)).slice(0,10).map(r=>[r.EMP_NAME,r.AREA_NAME,num(r.OT)]);\n    const u={};cur.filter(nr).forEach(r=>u[r.AREA_NAME]=(u[r.AREA_NAME]||0)+num(r.OT));top.u=Object.entries(u).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,v])=>[n,n,v])}\n  const RK=[];if(S.tlbr){const sh=S.tlbr.SheetNames.includes(BLN[per-1])?BLN[per-1]:S.tlbr.SheetNames[S.tlbr.SheetNames.length-1];\n    rows('tlbr',sh).forEach(r=>r.forEach((c,j)=>{const m=monOf(c);if(m&&typeof c==='string'&&typeof r[j-1]==='number'&&r[j+1]>1e5)RK[m]=r[j+1]}))}\n  if(S.rkap){const r=rows('rkap',S.rkap.SheetNames[0]),hi=r.findIndex(x=>x.some(c=>String(c||'').toUpperCase()==='URAIAN'));if(hi>=0){const cm=r[hi].map(monOf);RK.length=0;r.slice(hi+1).forEach(x=>{if(String(x[0]||'').trim())cm.forEach((m,j)=>{if(m&&typeof x[j]==='number')RK[m]=(RK[m]||0)+x[j]})})}}\n  const biaya=L.reduce((s,v,m)=>m<=per?s+(v||0):s,0);\n  let manual=null;try{manual=parseFloat(localStorage.getItem('sdm_bud_'+per))||null}catch(e){}\n  const rkSum=RK.reduce((s,v,m)=>m<=per?s+(v||0):s,0);\n  const budget=manual||(rkSum||null),dv=budget!=null?budget-biaya:null;\n  let reim=null;if(S.eval)reim=rows('eval','Data Lembur 2026').filter(r=>typeof r[0]==='number'&&typeof r[18]==='number').reduce((s,r)=>s+Math.max(0,r[18]),0);\n\n  // kelompok\n  const kel=[0,0,0,0],unm=new Set();\n  tk.forEach(r=>{const a=String(r.AREA_NAME||'').trim().toUpperCase(),g=PETA[a];if(g==null)unm.add(a);else kel[g]++});\n  // tren\n  const HD=trend('hadir',[3,4,5]);\n  if(S.jab)S.jab.SheetNames.filter(n=>/^\\d+$/.test(n)).forEach(n=>{const r=rows('jab',n),h=(r[0]||[]).map(x=>String(x||'').trim().toUpperCase()),ci=nm=>h.findIndex(x=>nm.includes(x)),c3=[ci(['A','ALPA','ALPHA']),ci(['S','SAKIT']),ci(['I','IZIN'])];\n    if(c3.some(c=>c<0))return;const dd=r.slice(1).filter(x=>x[0]&&x[1]);HD[+n]=c3.map(c=>dd.reduce((t,x)=>t+num(x[c]),0))});\n  let absNow=null;\n  if(S.abs){const d=rows('abs','Sheet2').filter(r=>typeof r[0]==='number'&&r[1]);absNow={a:d.reduce((s,r)=>s+num(r[7]),0),s:d.reduce((s,r)=>s+num(r[9]),0),i:d.reduce((s,r)=>s+num(r[10]),0)};HD[per]=[absNow.a,absNow.s,absNow.i]}\n  const hm=Object.keys(HD).map(Number).sort((a,b)=>a-b),SK=trend('sanksi',[3,4,5,6,7]);Object.keys(SKM).forEach(m=>SK[m]=SKM[m]);const sm=Object.keys(SK).map(Number).sort((a,b)=>a-b);\n  // pensiun\n  const jab={};if(S.jab)S.jab.SheetNames.filter(n=>/^\\d+$/.test(n)).forEach(n=>{const r=rows('jab',n),ji=(r[0]||[]).findIndex(x=>/^jabatan$/i.test(String(x||'').trim()));if(ji>=0)r.slice(1).forEach(x=>{if(x[0]&&x[ji]&&!jab[x[0]])jab[x[0]]=x[ji]})});\n  const pn=pes.filter(r=>/USIA PENSIUN/i.test(r['PENYEBAB PHK']||'')&&dm(r['TGL KELUAR'])[1]<=per);\n  const pj={'Kepala Divisi':0,'Kepala Unit':0,'Supervisor':0,'Pelaksana':0};pn.forEach(r=>{let g=S.jab?jabGrup(jab[r.NIP]):null;if(g==='Tidak diketahui')g='Pelaksana';if(g)pj[g]++});\n  // dplk\n  const D={};if(S.dplk)['PKWTT','PKWT'].forEach(sh=>{const r=rows('dplk',sh);\n    const last=x=>{for(let i=x.length-1;i>=0;i--)if(typeof x[i]==='number')return x[i];return null};\n    const f=r.find(x=>[x[0],x[1],x[2]].some(c=>String(c||'').trim()==='F')),g=r.find(x=>[x[0],x[1],x[2]].some(c=>String(c||'').trim()==='G'));\n    if(f&&g&&last(f)&&last(g))D[sh]={kew:last(f),aset:last(g)}});\n\n  // KPI\n  const K=(ic,bg,l,v,n)=>`<div class=\"card kpi\"><div class=\"ic\" style=\"background:color-mix(in srgb,var(${bg}) 18%,var(--card))\">${ic}<\/div><div><div class=\"v\">${v}<\/div><div class=\"l\">${l}<\/div><div class=\"n\">${n||''}<\/div><\/div><\/div>`;\n  const d='—';\n  $('kpis').innerHTML=K('👥','--c1','Total karyawan',has?fmt(total):d)+K('🏷️','--c5','PKWTT (tetap)',has?fmt(pkwtt):d,has?pct(pkwtt/total):'')+K('⏱️','--c3','PKWT (kontrak)',has?fmt(pkwt):d,has?pct(pkwt/total):'')+K('👨','--c2','Laki-laki',has?fmt(lk):d)+K('👩','--c4','Perempuan',has?f idth:100%}\n.bar{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:16px}.bar label{font-weight:700;color:var(--mu);margin-right:8px}\n.dz{border:3px dashed var(--bd);border-radius:20px;padding:60px 20px;text-align:center;cursor:pointer;background:var(--card);margin-top:24px}.dz.on{background:rgba(122,15,42,.12)}.dz b{display:block;font-size:28px;color:var(--pr);margin:8px 0}\n<\/style><\/head><body><div class=\"w\">\n<header><div><h1>DASHBOARD LAPORAN PELAKSANAAN PEKERJAAN SDM<\/h1><div class=\"sub\" id=\"sub\"><\/div><\/div>\n<div><input type=\"file\" id=\"f\" accept=\".xlsx,.xlsm\" hidden><button class=\"up\" onclick=\"f.click()\">⬆ Pilih file Excel<\/button><\/div><\/header>\n<div class=\"bar hide\" id=\"bar\"><div><label>Pilih Bulan (Sheet Laporan):<\/label><select id=\"ss\"><\/select><\/div><div id=\"tkw\" class=\"hide\"><label>Sheet Tenaga Kerja:<\/label><select id=\"st\"><\/select><\/div><\/div>\n<div class=\"dz\" id=\"dz\" onclick=\"f.click()\"><div style=\"font-size:56px\">📂<\/div><b>Seret file Excel ke sini, atau klik untuk memilih<\/b><div class=\"sub\">File berisi sheet laporan tiap bulan dan sheet \"Lap TK\". Data dibaca di browser Anda dan tidak dikirim ke mana pun.<\/div><\/div>\n<div id=\"main\" class=\"hide\"><div class=\"kp\" id=\"kp\"><\/div>\n<div class=\"sec\">1. Pilih Kategori<\/div><div class=\"tg\" id=\"tg\"><\/div>\n<div class=\"sec\">2. Pilih Uraian Tugas<\/div><div class=\"ch\" id=\"ch\"><\/div>\n<div id=\"dt\"><\/div><\/div><\/div>\n<script>\nlet KPI={};\nconst COL=['#E11A45','#1f9d55','#e6b800','#0aa2e8','#f6738f','#e67e22','#6c5ce7','#00a8a8'];\nconst ICO=['👥','👷','🦺','📋','💰','🎯','📦','🏥'];\nconst E=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nconst rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');const num=n=>Number(n).toLocaleString('id-ID');\nconst cl=v=>{v=String(v??'').trim();return(v===''||v==='-')?'':v};\nlet T=[],cat='Laporan',sel=null;\nfunction parse(R){const tasks=[];let cur=null,pre=[];\n for(const r of R){const no=r[0],nm=cl(r[2]);\n  if(no!==''&&nm){cur={no,nama:nm,items:[],cats:{}};tasks.push(cur);if(pre.length){cur.items.push(...pre);pre=[]}}\n  let lab=cl(r[5]);const e=cl(r[4]);if(!lab&&e&&isNaN(e))lab='Total (Jumlah)';\n  const j=typeof r[7]==='number'?r[7]:null,nil=typeof r[11]==='number'?r[11]:null,sta=cl(r[17]);\n  if(!lab&&no!==''&&(sta||j!==null||nil!==null))lab='Keseluruhan';\n  if(!lab||(j===null&&nil===null&&!sta))continue;\n  const it={lab,j,sat:cl(r[8]),nil,ken:cl(r[15]),tl:cl(r[16]),sta:sta?(sta.toLowerCase()==='open'?'Open':'Close'):'',ket:cl(r[18]),kat:cl(r[19])};\n  if(cur){cur.items.push(it);if(it.kat)cur.cats[it.kat]=(cur.cats[it.kat]||0)+1}else pre.push(it)}\n return tasks.filter(t=>t.items.length).map(t=>{t.kat=Object.entries(t.cats).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Laporan';return t})}\nfunction kpi(){const k=KPI,c=[];\n if(k.pkwtt!=null)c.push(['TOTAL TENAGA KERJA',k.total,'#E11A45','👥'],['PKWTT',k.pkwtt,'#1f9d55','👷'],['PKWT',k.pkwt,'#e6b800','🦺'],['OUTSOURCING',k.os,'#0aa2e8','🏭'],['TASKFORCE + VARCOST',(k.tf||0)+(k.varcost||0),'#a78bfa','🧰']);\n if(k.ful!=null)c.push(['FULFILLMENT TENAGA KERJA',k.ful.toFixed(2).replace('.',',')+'%','#e67e22','🎯']);\n document.getElementById('kp').innerHTML=c.map(x=>`<div class=\"k\"><div class=\"ic\" style=\"background:${x[2]}\">${x[3]}<\/div><div><small>${x[0]}<\/small><b>${typeof x[1]==='number'?num(x[1]):x[1]}<\/b><\/div><\/div>`).join('')}\nfunction draw(){\n document.getElementById('tg').innerHTML=['Laporan','Progres'].map(c=>`<button class=\"${c==cat?'on':''}\" onclick=\"cat='${c}';sel=null;draw()\">${c} (${T.filter(t=>t.kat==c).length})<\/button>`).join('');\n const L=T.filter(t=>t.kat==cat);if(!L.find(t=>t.no==sel))sel=null;\n document.getElementById('ch').innerHTML=L.map(t=>`<button class=\"${t.no==sel?'on':''}\" onclick=\"sel='${t.no}';draw()\">${t.no}. ${E(t.nama)}<\/button>`).join('');\n const d=document.getElementById('dt'),t=L.find(t=>t.no==sel);\n if(!t){d.innerHTML=`<div class=\"pn em\">👆 Pilih salah satu uraian tugas untuk melihat detail hasil<\/div>`;return}\n const it=t.items,cs=it.filter(i=>i.sta=='Close').length,op=it.filter(i=>i.sta=='Open').length,pct=cs+op?Math.round(cs/(cs+op)*100):0;\n const nums=it.filter(i=>i.j!==null),mx=Math.max(1,...nums.map(i=>i.j));\n const uniq=k=>{const m={};it.forEach(i=>{if(i[k]){(m[i[k]]=m[i[k]]||[]).push(i.lab)}});return m};\n const bl=(k,t2)=>{const m=uniq(k),e=Object.entries(m);return`<div><h3>${t2}<\/h3>${e.length?'<ul>'+e.map(([v,l])=>`<li>${E(v)}${l.length<it.length&&l.length<4?` <small style=\"color:var(--mu)\">(${E(l.join(', '))})<\/small>`:''}<\/li>`).join('')+'<\/ul>':'<span style=\"color:var(--mu)\">Tidak ada<\/span>'}<\/div>`};\n d.innerHTML=`<div class=\"pn\"><h2>${t.no}. ${E(t.nama)} <span class=\"st ${op?'Open':'Close'}\">${op?'ADA YANG OPEN':'SEMUA CLOSE'}<\/span><\/h2>\n <div class=\"sec\">Hasil (Jumlah)<\/div><div class=\"g\">${it.map((i,x)=>`<div class=\"h\"><div class=\"ic\" style=\"background:${COL[x%8]}\">${ICO[x%8]}<\/div><div><div class=\"l\">${E(i.lab)}<\/div><div class=\"n\">${i.j!==null?num(i.j):(i.nil!==null?'—':'-')}<s>${E(i.sat)}<\/s><\/div>${i.nil!==null?`<div class=\"rp\">${rp(i.nil)}<\/div>`:''}${i.sta?`<span class=\"st ${i.sta}\">${i.sta.toUpperCase()}<\/span>`:''}<\/div><\/div>`).join('')}<\/div>\n ${nums.length>1?`<div class=\"sec\">Grafik Perbandingan Jumlah<\/div><div class=\"bars\">${nums.map((i,x)=>`<div class=\"r\"><div>${E(i.lab)}<\/div><div class=\"t\"><div class=\"f\" style=\"width:${i.j/mx*100}%;background:${COL[it.indexOf(i)%8]}\"><\/div><\/div><div class=\"v\">${num(i.j)}<\/div><\/div>`).join('')}<\/div>`:''}\n <div class=\"sec\">Kendala · Tindak Lanjut · Keterangan<\/div><div class=\"c3\">${bl('ken','KENDALA YANG DIHADAPI')}${bl('tl','TINDAK LANJUT')}${bl('ket','KETERANGAN')}<\/div>\n <div class=\"sec\">Detail Data<\/div><div class=\"tw\"><table><tr><th>No<\/th><th>Uraian<\/th><th>Jumlah<\/th><th>Nilai (Rp)<\/th><th>Kendala<\/th><th>Tindak Lanjut<\/th><th>Status<\/th><th>Keterangan<\/th><\/tr>${it.map((i,x)=>`<tr><td>${x+1}<\/td><td><b>${E(i.lab)}<\/b><\/td><td>${i.j!==null?num(i.j)+' '+E(i.sat):'-'}<\/td><td>${i.nil!==null?rp(i.nil):'-'}<\/td><td>${E(i.ken)||'-'}<\/td><td>${E(i.tl)||'-'}<\/td><td>${i.sta?`<span class=\"st ${i.sta}\">${i.sta}<\/span>`:'-'}<\/td><td>${E(i.ket)||'-'}<\/td><\/tr>`).join('')}<\/table><\/div><\/div>`}\nfunction init(R,title){T=parse(R);document.getElementById('sub').textContent=title||'Sumber: sheet 13-10';kpi();draw()}\nlet WB=null,FN='';const $=i=>document.getElementById(i);\nconst isTK=n=>/lap\\s*tk/i.test(n),a1=n=>String(WB.Sheets[n]['A1']?.v||'');\nconst nn=v=>typeof v==='number'?v:0;\nfunction readKPI(name){const K={};if(!name)return K;\n for(const r of XLSX.utils.sheet_to_json(WB.Sheets[name],{header:1,defval:''})){\n  const t=r.slice(0,4).findIndex(c=>String(c).trim().toUpperCase()==='TOTAL');\n  if(t>=0&&K.pkwt==null){K.kontrak=nn(r[t+2]);K.pkwt=nn(r[t+3]);K.pkwtt=nn(r[t+4]);K.os=nn(r[t+5]);K.tf=nn(r[t+6]);K.varcost=nn(r[t+7]);K.total=K.pkwt+K.pkwtt+K.os+K.tf+K.varcost}\n  const f=r.findIndex(c=>/fulfil/i.test(String(c)));\n  if(f>=0&&K.ful==null){const v=r.slice(f+1).find(x=>typeof x==='number');if(v!=null)K.ful=v}}\n return K}\nfunction load(){const sn=$('ss').value;\n const a=XLSX.utils.sheet_to_json(WB.Sheets[sn],{header:1,defval:'',range:4});\n KPI=readKPI($('st').value||WB.SheetNames.find(isTK)||'');\n cat='Laporan';sel=null;\n init(a.map(r=>Array.from({length:20},(_,i)=>r[i]??'')),'Sumber: '+FN+' — sheet \"'+sn+'\" · '+a1(sn))}\nfunction fill(s,arr,idx){s.innerHTML='';arr.forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;s.appendChild(o)});s.selectedIndex=idx}\nasync function onfile(fl){if(!fl)return;\n try{WB=XLSX.read(await fl.arrayBuffer(),{type:'array'});FN=fl.name;\n  let ls=WB.SheetNames.filter(n=>!isTK(n)&&/laporan/i.test(a1(n)));\n  if(!ls.length)ls=WB.SheetNames.filter(n=>!isTK(n)&&/^\\s*\\d{1,2}[-.\\/]\\d{1,2}/.test(n));\n  if(!ls.length){alert('Sheet laporan tidak ditemukan. Sheet di file ini: '+WB.SheetNames.join(', '));return}\n  const tk=WB.SheetNames.filter(isTK);\n  fill($('ss'),ls,ls.length-1);fill($('st'),tk,Math.min(ls.length-1,Math.max(tk.length-1,0)));\n  $('tkw').classList.toggle('hide',tk.length<2);$('bar').classList.remove('hide');$('dz').classList.add('hide');$('main').classList.remove('hide');\n  load()}catch(x){alert('Gagal membaca file: '+x.message)}}\n$('f').onchange=e=>{onfile(e.target.files[0]);e.target.value=''};\n$('ss').onchange=()=>{const tk=WB.SheetNames.filter(isTK);if(tk.length>1)$('st').selectedIndex=Math.min($('ss').selectedIndex,tk.length-1);load()};\n$('st').onchange=load;\nconst dz=$('dz');['dragover','dragenter'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('on')}));\n['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('on')}));\ndz.addEventListener('drop',e=>onfile(e.dataTransfer.files[0]));\n<\/script><\/body><\/html>"};
